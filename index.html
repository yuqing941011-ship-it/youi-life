<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>學習 × 生活 V1</title>
<style>
:root{
  --bg:#f7f7fb;
  --card:#ffffff;
  --ink:#252637;
  --muted:#8b8da3;
  --line:#ececf4;
  --primary:#7b73d1;
  --primary-2:#9690df;
  --blue:#86a8df;
  --pink:#e8a6bd;
  --green:#9ec8b0;
  --yellow:#e5c98b;
  --danger:#dc6d7d;
  --shadow:0 10px 28px rgba(66,60,120,.08);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
}
button,input,select{font:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.topbar{
  position:sticky;top:0;z-index:5;background:rgba(247,247,251,.92);
  backdrop-filter:blur(12px);padding:16px 18px 8px
}
.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}
.view-switch{display:flex;gap:4px;background:#eeeeF6;border-radius:12px;padding:3px}
.view-switch button{border:0;background:transparent;padding:7px 9px;border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer}
.view-switch button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(66,60,120,.08)}
.mood-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.header-deco{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;margin-right:10px;
  color:#b7b0ee;font-size:18px;pointer-events:none
}
.life-date-select-btn.selected{
  background:#eeeafd;color:var(--primary);border-color:#c9c3f4
}
.life-selected-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#f3f1ff;border:1px solid #ddd8fb;border-radius:14px;padding:10px 12px;margin:10px 0
}


h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{
  text-align:center;padding:8px 2px;border-radius:14px;color:var(--muted);font-size:12px
}
.day b{display:block;font-size:15px;color:var(--ink);margin-top:4px}
.day.active{background:var(--primary);color:#fff}.day.active b{color:#fff}
.content{padding:8px 16px 18px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px;margin:12px 0;box-shadow:var(--shadow)
}
.card.flat{box-shadow:none}
.card h3{margin:0 0 10px;font-size:17px}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;background:#efeffa;color:var(--primary)}
.primary{
  width:100%;border:0;background:var(--primary);color:white;border-radius:14px;
  padding:13px 14px;font-weight:700;cursor:pointer
}
.secondary{
  border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;color:var(--ink);cursor:pointer
}
.ghost{border:0;background:transparent;color:var(--primary);padding:8px;cursor:pointer}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-grid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:12px}
.progress{height:8px;background:#efeff6;border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--primary);border-radius:999px}
.task{
  display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)
}
.task:last-child{border-bottom:0}
.check{
  width:22px;height:22px;border-radius:50%;border:2px solid #c9cad8;flex:0 0 auto;
  display:grid;place-items:center;background:#fff;cursor:pointer
}
.check.done{background:var(--primary);border-color:var(--primary);color:white}
.task-title{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.pill{margin-left:auto;font-size:11px;color:var(--muted);background:#f3f3f8;padding:5px 8px;border-radius:999px}
.timeline{position:relative;padding:0}
.time-section{margin:8px 0 16px}
.time-section-head{
  display:flex;align-items:center;gap:8px;margin:0 0 8px;
  font-size:12px;font-weight:800;color:var(--muted)
}
.time-section-head:before{
  content:"";width:8px;height:8px;border-radius:50%;background:#cbc5f2;flex:0 0 auto
}
.time-section-head:after{content:"";height:1px;background:var(--line);flex:1}
.time-item{
  display:grid;grid-template-columns:28px minmax(0,1fr) auto;
  gap:10px;align-items:center;padding:11px 10px;
  border-radius:14px;background:#fafafe;margin:7px 0
}
.dot{display:none}
.t-time{font-size:12px;color:var(--muted)}
.t-name{font-weight:700;margin:0;min-width:0}

.drag-handle{cursor:grab;color:#aaa;font-size:18px;user-select:none}
.dragging{opacity:.45}
.drop-zone{
  border:1.5px dashed #cbc5f2;background:#faf9ff;border-radius:14px;
  padding:10px;text-align:center;color:var(--muted);font-size:12px;margin:8px 0
}
.task[draggable="true"]{cursor:grab}
.schedule-edit{
  margin-left:auto;display:flex;gap:6px
}

.time-item .meta{
  margin:0;font-size:11px;padding:4px 7px;border-radius:999px;background:#f0eff8;white-space:nowrap
}
.task-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{
  width:30px;height:30px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--muted);cursor:pointer
}
.life-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.life-card{cursor:pointer;transition:.15s}
.life-card:active{transform:scale(.99)}
.life-list .task{align-items:center}

.schedule-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px
}
.category-select{
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;
  color:var(--ink);font-size:12px;min-width:96px
}
.period-switch{display:flex;gap:4px;background:#efeff6;border-radius:12px;padding:3px}
.period-switch button{
  border:0;background:transparent;padding:7px 10px;border-radius:9px;color:var(--muted);
  font-size:12px;cursor:pointer
}
.period-switch button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(66,60,120,.08)}
.life-calendar{padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-week{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal-day{
  position:relative;aspect-ratio:1/1;border:0;background:#fafafe;border-radius:12px;
  color:var(--ink);cursor:pointer;font-size:13px
}
.cal-day.other{opacity:.35}
.cal-day.selected{background:var(--primary);color:#fff}
.cal-day.today:not(.selected){outline:1.5px solid var(--primary)}
.cal-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--pink);bottom:5px;left:50%;transform:translateX(-50%)}
.cal-day.selected .cal-dot{background:#fff}

.life-tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.life-tabs button{white-space:nowrap}
.stock-good{color:#4b9a6f}.stock-low{color:#d1803a}.stock-expired{color:var(--danger)}

.habit-group{margin:12px 0}
.habit-group-title{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:800;color:var(--muted);margin:4px 2px 8px
}
.habit-row{
  display:grid;grid-template-columns:minmax(76px,1.2fr) repeat(7,32px);
  gap:6px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)
}
.habit-row:last-child{border-bottom:0}
.habit-day{
  width:28px;height:28px;border-radius:50%;border:0;background:#ececf3;
  color:#999;display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer
}
.habit-day.done{background:var(--primary);color:#fff}
.habit-day.today{outline:2px solid #cfc8f6;outline-offset:2px}
.habit-days-head{
  display:grid;grid-template-columns:minmax(76px,1.2fr) repeat(7,32px);
  gap:6px;align-items:center;margin:4px 0 6px;color:var(--muted);font-size:11px
}
.habit-days-head > div{text-align:center}
.habit-name{font-weight:700;min-width:0}
.habit-cat-badge{
  display:inline-flex;padding:3px 7px;border-radius:999px;background:#f0eff8;
  color:var(--primary);font-size:10px;margin-top:3px
}


.bottom{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:min(520px,100vw);height:72px;
  background:rgba(255,255,255,.98);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:50
}
.nav{
  min-width:0;height:58px;border:0;background:transparent;padding:4px 2px;
  touch-action:manipulation;position:relative;z-index:51;
  color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;white-space:nowrap
}
.nav b{display:block;font-size:20px;line-height:1.1}.nav.active{color:var(--primary)}
.add-slot{padding:0}
.fab{
  width:48px;height:48px;border-radius:16px;background:var(--primary);color:white;
  font-size:30px;line-height:46px;display:block;margin:auto;box-shadow:0 8px 18px rgba(123,115,209,.25)
}
.completed-toggle{
  width:100%;border:0;background:transparent;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0 2px;cursor:pointer
}
.completed-panel{margin-top:6px}
.completed-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.restore{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--primary);font-size:18px;line-height:1;cursor:pointer
}
.done-text{text-decoration:line-through;color:#a8a9b7}

.section-title{font-weight:800;margin:18px 2px 6px}
.course{
  padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;margin:10px 0
}
.course-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.course-name{font-weight:800}.course small{color:var(--muted)}


.pomo-card{text-align:center;padding:22px}

.focus-tabs{display:flex;gap:4px;background:#f1f1f7;border-radius:12px;padding:3px;margin:10px 0}
.focus-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 5px;font-size:12px;color:var(--muted)}
.focus-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06);font-weight:700}
.focus-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.focus-stat{background:#fafafe;border-radius:14px;padding:12px;text-align:center}
.focus-stat b{display:block;font-size:20px}
.focus-stat small{color:var(--muted)}
.hour-bars{display:flex;flex-direction:column;gap:8px}
.hour-row{display:grid;grid-template-columns:42px 1fr 52px;gap:8px;align-items:center;font-size:12px}
.hour-track{height:12px;background:#f0f0f5;border-radius:999px;overflow:hidden}
.hour-fill{height:100%;background:#f2b86b;border-radius:999px}
.focus-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.focus-cal-cell{aspect-ratio:1/1;border-radius:10px;background:#f2f2f6;padding:5px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.focus-cal-cell.l1{background:#fff0d8}.focus-cal-cell.l2{background:#ffdca7}.focus-cal-cell.l3{background:#ffc56d}.focus-cal-cell.l4{background:#f1ad44}
.music-box{display:flex;flex-direction:column;gap:10px}
.music-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.music-now{padding:12px;border-radius:14px;background:#f7f7fb}
.pomo-time{font-size:58px;font-weight:800;letter-spacing:2px;margin:14px 0}.pomo-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.danger-text{color:var(--danger)!important}
.chapter-list{display:flex;flex-direction:column;gap:8px}
.chapter-row{
  display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:10px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px
}
.chapter-side{
  width:42px;height:42px;border-radius:13px;border:1px solid var(--line);
  background:#fafafe;color:var(--muted);font-size:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px
}
.chapter-side.done{background:#eeeafd;color:var(--primary);border-color:#cfc8f6;font-weight:800}
.chapter-side.teacher.done{background:#eaf4ff;color:#5f8fc8;border-color:#cfe2f7}
.chapter-title{min-width:0}
.chapter-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter-title small{display:block;margin-top:3px}
.chapter-menu{border:0;background:transparent;color:var(--muted);padding:3px 5px;cursor:pointer}

.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px}
.tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.modal{
  position:fixed;inset:0;background:rgba(29,28,48,.26);display:none;align-items:flex-end;justify-content:center;z-index:120
}
.modal.show{display:flex}
.sheet{
  width:min(520px,100%);background:white;border-radius:24px 24px 0 0;padding:18px;
  max-height:90vh;overflow:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))
}
.sheet h2{margin:0 0 14px}
.sheet-actions{
  position:sticky;bottom:-1px;background:#fff;padding:12px 0 2px;margin-top:14px;
  border-top:1px solid var(--line);z-index:2
}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--ink)
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px}
.energy button.active{border-color:var(--primary);background:#f1f0fb;color:var(--primary)}
.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fffdf8;border:1px dashed #d8d2c6}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi > div{background:#f7f7fb;border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:20px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
.toast{
  position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#2f3041;color:#fff;
  padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:50
}
.toast.show{display:block}

.week-planner{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.week-col{min-width:92px;background:#fafafe;border:1px solid var(--line);border-radius:14px;padding:8px}
.week-col.today{outline:2px solid #cfc8f6}
.week-col h4{margin:0 0 8px;text-align:center;font-size:12px}
.week-drop{min-height:120px}
.week-task{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;margin:6px 0;cursor:grab}
.capacity-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.capacity-row button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pick-card{padding:18px;text-align:center}


.game-map{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 0}
.map-stop{min-width:84px;text-align:center;padding:10px 7px;border-radius:14px;background:#f4f3f9;font-size:11px}
.map-stop.reached{background:#ece8ff;color:var(--primary);font-weight:800}
.game-currency{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.game-currency>div{text-align:center;background:#fafafe;border-radius:14px;padding:10px}
.game-currency b{display:block;font-size:18px}
.house-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.house-room{background:#fafafe;border:1px solid var(--line);border-radius:14px;padding:12px}
.settle-result{background:linear-gradient(180deg,#fbfaff,#f5f3fb);border-radius:18px;padding:16px;margin:10px 0}
.quote-card{font-family:serif;font-size:16px;line-height:1.8;text-align:center;padding:20px 14px}
.event-card{border:1px dashed #cfc8f6;background:#faf9ff;border-radius:16px;padding:14px}


.brief-card{background:linear-gradient(180deg,#fbfaff,#f7f5ff);border:1px solid #ece8ff}
.brief-line{padding:5px 0;line-height:1.55}
.load-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.load-cell{border-radius:12px;padding:8px 4px;text-align:center;background:#f3f3f7;font-size:10px}
.load-cell.l1{background:#f1efff}.load-cell.l2{background:#ddd8ff}.load-cell.l3{background:#c5bdf7}.load-cell.l4{background:#a99ce9;color:#fff}
.codex-world{padding:10px 0;border-bottom:1px solid var(--line)}
.codex-world:last-child{border-bottom:0}
.risk-badge{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:10px;background:#fff0f0;color:#c26060}


.grade-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade-kpi{background:#fafafe;border-radius:14px;padding:12px;text-align:center}
.grade-kpi b{display:block;font-size:18px}
.grade-kpi small{color:var(--muted);font-size:10px}
.grade-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.grade-row:last-child{border-bottom:0}
.grade-score{font-size:18px;font-weight:800}
.grade-good{color:#4b9a6f}.grade-warn{color:#d18a3a}.grade-bad{color:#c96666}


.timetable-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;max-height:62vh}
.tt-grid{display:grid;grid-template-columns:54px repeat(7,minmax(92px,1fr));min-width:760px;position:relative}
.tt-head{position:sticky;top:0;z-index:4;background:#fafafe;padding:9px 4px;text-align:center;font-size:11px;font-weight:800;border-bottom:1px solid var(--line)}
.tt-time{position:sticky;left:0;z-index:3;background:#fafafe;padding:8px 5px;text-align:center;font-size:10px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:52px}
.tt-cell{position:relative;min-height:52px;border-right:1px solid #f1f1f5;border-bottom:1px solid #f1f1f5;padding:3px;cursor:pointer}
.tt-cell:hover{background:#faf9ff}
.tt-class{height:100%;min-height:44px;border-radius:10px;padding:6px 7px;background:#ece8ff;color:#4f478f;font-size:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tt-class b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-class small{display:block;opacity:.72;margin-top:2px}
.tt-legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}


/* Cherry Letter Club theme — 2026-08-21 */
:root{--bg:#fbf2ee;--card:#fffaf5;--ink:#4a2928;--muted:#9b7772;--line:#ead5cf;--primary:#9e2338;--primary-2:#c05b68;--blue:#9eb5c3;--pink:#d9969f;--green:#a9b58f;--yellow:#d9bd86;--danger:#a62b3d;--shadow:0 8px 22px rgba(112,54,57,.09)}
body{background-color:var(--bg);background-image:linear-gradient(rgba(158,35,56,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(158,35,56,.025) 1px,transparent 1px);background-size:24px 24px}
.topbar{background:rgba(251,242,238,.94);border-bottom:1px solid rgba(158,35,56,.06)}
.card{border-radius:16px;border-color:var(--line);box-shadow:var(--shadow);position:relative}
.card:before{content:"";position:absolute;left:14px;right:14px;top:0;height:4px;border-radius:0 0 8px 8px;background:repeating-linear-gradient(45deg,rgba(158,35,56,.28) 0 8px,rgba(255,255,255,.2) 8px 16px);opacity:.38}
.primary{background:linear-gradient(135deg,#8f2035,#b54a59);box-shadow:0 5px 14px rgba(143,32,53,.18)}
.secondary,.quick-grid button{background:#fffaf5;border-color:#ead5cf}
.badge{background:#f5e5e2;color:#8f2035}.progress{background:#f2e2de}.progress>i{background:linear-gradient(90deg,#c97982,#9e2338)}

<script>
const defaultData = {
  energy:"normal",
  tasks:[

    {id:4,title:"整理桌面",type:"life",minutes:10,due:"2026-08-22",done:false,priority:1}
  ],
  schedule:[
    {time:"09:00",name:"中級會計｜上課"},
    {time:"12:00",name:"午餐"},
    {time:"18:30",name:"中會作業"},
    {time:"20:00",name:"洗衣服"},
    {time:"21:00",name:"日文單字"}
  ],
  courses:[
    {id:1,name:"中級會計",teacherProgress:68,myProgress:47,teacherAt:"Ch.6",meAt:"Ch.4",color:"#7b73d1"},
    {id:2,name:"刑法",teacherProgress:52,myProgress:42,teacherAt:"Unit 5",meAt:"Unit 4",color:"#86a8df"},
    {id:3,name:"日文",teacherProgress:63,myProgress:55,teacherAt:"L.8",meAt:"L.7",color:"#e8a6bd"}
  ],
  assignments:[
    {id:1,course:"中級會計",title:"Ch.4 Homework",due:"2026-08-25",nodes:[
      {t:"題目 1～10",done:true},{t:"題目 11～20",done:true},{t:"題目 21～30",done:false,partial:"6/10"},
      {t:"訂正",done:false},{t:"繳交",done:false}
    ]}
  ],
  habits:[
    {name:"喝水",week:[1,1,1,1,0,0,0]},
    {name:"保養",week:[1,1,0,1,0,0,0]},
    {name:"日文",week:[1,1,1,0,0,0,0]},
    {name:"整理房間",week:[0,1,0,1,0,0,0]}
  ]
};
let data = JSON.parse(localStorage.getItem("studyLifeV1")||"null") || defaultData;
if(!Array.isArray(data.goals)) data.goals=[];
let page="today";
function save(){localStorage.setItem("studyLifeV1",JSON.stringify(data))}
function toast(msg){const t=document.querySelector("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
function fmt(d){return new Date(d+"T12:00:00")}
function daysLeft(d){return Math.ceil((fmt(d)-new Date())/86400000)}
let calendarMode="week";
let selectedTodayDate=new Date();
function dateKey(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function sameDay(a,b){return dateKey(a)===dateKey(b)}
function selectTodayDate(key){
  const [y,m,d]=key.split("-").map(Number);
  selectedTodayDate=new Date(y,m-1,d);
  renderToday();
}
function moveSelectedDay(delta){
  selectedTodayDate=new Date(selectedTodayDate.getFullYear(),selectedTodayDate.getMonth(),selectedTodayDate.getDate()+delta);
  renderToday();
}
function moveSelectedMonth(delta){
  selectedTodayDate=new Date(selectedTodayDate.getFullYear(),selectedTodayDate.getMonth()+delta,1);
  renderToday();
}
function weekHeader(){
  const sel=new Date(selectedTodayDate);
  const realToday=new Date();
  const names=["日","一","二","三","四","五","六"];
  const isRealToday=sameDay(sel,realToday);
  let cal="";

  if(calendarMode==="day"){
    cal=`<div class="card flat" style="margin-top:12px">
      <div class="row space">
        <button class="ghost" onclick="moveSelectedDay(-1)">‹ 前一天</button>
        <div style="text-align:center">
          <b>${sel.toLocaleDateString("zh-TW",{month:"long",day:"numeric",weekday:"long"})}</b>
          <div class="sub">${isRealToday?"今天":"日視圖"}</div>
        </div>
        <button class="ghost" onclick="moveSelectedDay(1)">後一天 ›</button>
      </div>
    </div>`;
  }else if(calendarMode==="week"){
    const dow=sel.getDay();
    const mondayOffset=(dow+6)%7;
    const monday=new Date(sel); monday.setDate(sel.getDate()-mondayOffset);
    cal='<div class="week">';
    for(let i=0;i<7;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i);
      const active=sameDay(d,sel);
      const today=sameDay(d,realToday);
      cal+=`<button class="day ${active?'active':''}" style="border:0;background:${active?'var(--primary)':'transparent'};cursor:pointer"
        onclick="selectTodayDate('${dateKey(d)}')">
        ${names[d.getDay()]}${today?'・':''}<b>${d.getDate()}</b>
      </button>`;
    }
    cal+="</div>";
  }else{
    const y=sel.getFullYear(),m=sel.getMonth();
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    const start=first.getDay();
    cal=`<div class="card flat" style="margin-top:12px">
      <div class="row space">
        <button class="ghost" onclick="moveSelectedMonth(-1)">‹</button>
        <b>${y}年${m+1}月</b>
        <button class="ghost" onclick="moveSelectedMonth(1)">›</button>
      </div>
      <div class="week" style="margin-top:10px">`;
    for(let i=0;i<start;i++) cal+=`<div class="day"></div>`;
    for(let d=1;d<=last.getDate();d++){
      const dt=new Date(y,m,d), active=sameDay(dt,sel), today=sameDay(dt,realToday);
      cal+=`<button class="day ${active?'active':''}" style="border:0;background:${active?'var(--primary)':'transparent'};cursor:pointer"
        onclick="selectTodayDate('${dateKey(dt)}')">
        ${today?'今':''}<b>${d}</b>
      </button>`;
    }
    cal+="</div></div>";
  }

  return `<div class="row space">
    <div>
      <h1>${isRealToday?"今日":sel.toLocaleDateString("zh-TW",{month:"numeric",day:"numeric"})}</h1>
      <div class="sub">${sel.toLocaleDateString("zh-TW",{month:"long",day:"numeric",weekday:"long"})}</div>
    </div>
    <div class="row">
      <div class="view-switch">
        <button class="${calendarMode==='day'?'active':''}" onclick="setCalendarMode('day')">日</button>
        <button class="${calendarMode==='week'?'active':''}" onclick="setCalendarMode('week')">週</button>
        <button class="${calendarMode==='month'?'active':''}" onclick="setCalendarMode('month')">月</button>
      </div>
      <button class="mood-btn" onclick="openEnergy()" title="今日狀態">🙂</button>
    </div>
  </div>${cal}`;
}
function setCalendarMode(mode){calendarMode=mode;renderToday();}

function render(){
  document.querySelectorAll(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="today") renderToday();
  if(page==="study") renderStudy();
  if(page==="life") renderLife();
  if(page==="me") renderMe();
}

let schedulePeriod="all";
let scheduleCategory="all";
function scheduleCategoryOf(x){
  if(x.category) return x.category;
  const n=(x.name||"");
  if(/健康|運動|散步|喝水|保養|吃藥|睡/.test(n)) return "health";
  if(/洗衣|整理|午餐|晚餐|早餐|採購|買|生活/.test(n)) return "life";
  return "study";
}
function setSchedulePeriod(p){schedulePeriod=p;renderToday();}
function setScheduleCategory(c){scheduleCategory=c;renderToday();}
function timeToMinutes(t){
  const [h,m]=(t||"00:00").split(":").map(Number);
  return h*60+m;
}
function periodForTime(t){
  const m=timeToMinutes(t);
  if(m<720) return "morning";
  if(m<1080) return "afternoon";
  return "evening";
}
function periodLabel(p){
  return p==="morning"?"早上":p==="afternoon"?"下午":"晚上";
}
function renderScheduleByPeriod(){
  const groups={morning:[],afternoon:[],evening:[]};
  [...data.schedule]
    .filter(x=>{
      const sd=dateKey(selectedTodayDate);
      const legacyToday=!x.date && sameDay(selectedTodayDate,new Date());
      const onSelected=(x.date===sd)||legacyToday;
      return onSelected && (scheduleCategory==="all" || scheduleCategoryOf(x)===scheduleCategory);
    })
    .sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time))
    .forEach(x=>groups[periodForTime(x.time)].push(x));

  const wanted=schedulePeriod==="all"?["morning","afternoon","evening"]:[schedulePeriod];
  const symbols={morning:"☀",afternoon:"◐",evening:"☾"};
  return wanted.map(p=>{
    const list=groups[p];
    return `<div class="time-section"
      ondragover="allowScheduleDrop(event)"
      ondrop="dropTaskToPeriod(event,'${p}')">
      <div class="time-section-head">${symbols[p]} ${periodLabel(p)}</div>
      ${list.length?list.map((x,idx)=>`<div class="time-item" draggable="true"
        ondragstart="dragScheduleItem(event,'${x.time}','${(x.name||"").replace(/'/g,"\'")}')">
        <div class="drag-handle">⋮⋮</div>
        <div>
          <div class="t-time">${x.time}</div>
          <div class="t-name">${x.name}</div>
        </div>
        <div class="schedule-edit">
          <div class="meta">${scheduleCategoryOf(x)==="study"?"學習":scheduleCategoryOf(x)==="health"?"健康":"生活"}</div>
          <button class="icon-btn" onclick="editScheduleItem('${x.time}','${(x.name||"").replace(/'/g,"\'")}')" title="編輯">✎</button>
        </div>
      </div>`).join(""):'<div class="drop-zone">把今日任務拖到這裡</div>'}
    </div>`;
  }).join("");
}


function morningBriefHtml(){
  ensureProductivity();
  const k=localDateKey(new Date());
  const todayTasks=(data.tasks||[]).filter(t=>!t.done&&(t.due===k||(!t.due)));
  const dueSoon=(data.tasks||[]).filter(t=>!t.done&&t.due&&daysLeft(t.due)>=0&&daysLeft(t.due)<=3).sort((a,b)=>daysLeft(a.due)-daysLeft(b.due));
  const lag=(data.courses||[]).map(c=>({name:c.name,gap:(c.teacherProgress||0)-(c.myProgress||0)})).filter(x=>x.gap>=10).sort((a,b)=>b.gap-a.gap);
  const lines=[];
  if(todayTasks.length) lines.push(`🐦 今天有 ${todayTasks.length} 件待處理事項。`);
  else lines.push("🐦 今天沒有固定到期的任務。");
  if(dueSoon[0]) lines.push(`📮 最近截止：${dueSoon[0].title}（${daysLeft(dueSoon[0].due)===0?"今天":daysLeft(dueSoon[0].due)+" 天後"}）。`);
  if(lag[0]) lines.push(`📚 ${lag[0].name}目前落後老師約 ${lag[0].gap}%。`);
  const s=settlementStats?settlementStats():null;
  if(s && s.habitsTotal) lines.push(`🌱 今天共有 ${s.habitsTotal} 個習慣可以打卡。`);
  return `<div class="card brief-card"><div class="row space"><div><div class="meta">今日喜鵲來信</div><b>${new Date().toLocaleDateString("zh-TW",{month:"long",day:"numeric",weekday:"long"})}</b></div><button class="ghost" onclick="renderToday()">↻</button></div>
    <div style="height:8px"></div>${lines.map(x=>`<div class="brief-line">${x}</div>`).join("")}</div>`;
}
function overdueForRollover(){
  const today=localDateKey(new Date());
  return (data.tasks||[]).filter(t=>!t.done&&t.due&&t.due<today);
}
function checkDailyRollover(){
  ensureProductivity();
  const today=localDateKey(new Date());
  if(data.appMeta.lastRolloverPrompt===today)return;
  const arr=overdueForRollover();
  data.appMeta.lastRolloverPrompt=today;save();
  if(!arr.length)return;
  setTimeout(()=>openRolloverModal(),250);
}
function openRolloverModal(){
  const arr=overdueForRollover();
  if(!arr.length)return toast("沒有昨天遺留的任務");
  openModal(`<h2>昨日留下的行李</h2><div class="sub">有 ${arr.length} 件逾期事項，選擇要怎麼處理。</div>
    <div class="card flat">${arr.slice(0,8).map(t=>`<div class="task"><div style="flex:1"><div class="task-title">${t.title}</div><div class="meta">原截止 ${t.due}</div></div></div>`).join("")}</div>
    <div class="two"><button class="secondary" onclick="rolloverAll('week')">移到本週</button><button class="primary" onclick="rolloverAll('today')">全部移到今天</button></div>
    <div style="height:8px"></div><button class="ghost" onclick="closeModal()">先不處理</button>`);
}
function rolloverAll(mode){
  const arr=overdueForRollover(),today=localDateKey(new Date());
  const target=mode==="today"?today:addDaysKey(today,Math.max(1,7-((new Date().getDay()+6)%7)));
  arr.forEach(t=>t.due=target);
  save();closeModal();render();toast(mode==="today"?"已移到今天":"已移到本週稍後");
}
function courseRiskScore(c){
  let s=Math.max(0,(c.teacherProgress||0)-(c.myProgress||0))*3;
  const tasks=(data.tasks||[]).filter(t=>!t.done&&t.course===c.name);
  tasks.forEach(t=>{if(t.due){const d=daysLeft(t.due);if(d<0)s+=80;else if(d<=1)s+=50;else if(d<=3)s+=25;else if(d<=7)s+=10;}});
  const exams=(data.exams||[]).filter(e=>e.course===c.name&&e.date);
  exams.forEach(e=>{const d=daysLeft(e.date);if(d>=0&&d<=7)s+=35;});
  return s;
}
function loadHeatmapHtml(){
  const today=new Date(),cells=[];
  for(let i=0;i<14;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i),k=localDateKey(d);
    const mins=(data.tasks||[]).filter(t=>!t.done&&t.due===k).reduce((a,t)=>a+(t.minutes||15),0);
    const level=mins>=180?4:mins>=120?3:mins>=60?2:mins>0?1:0;
    cells.push(`<div class="load-cell ${level?"l"+level:""}"><b>${d.getMonth()+1}/${d.getDate()}</b><br>${mins?mins+"m":"—"}</div>`);
  }
  return `<div class="card flat"><div class="row space"><div><h3 style="margin:0">未來 14 天負荷</h3><div class="meta">顏色越深，預估任務時間越多</div></div><button class="secondary" onclick="openWeekPlanner()">調整</button></div><div style="height:10px"></div><div class="load-grid">${cells.join("")}</div></div>`;
}
function openTravelCodex(){
  const g=gameData();
  const worlds=[...(g.completedWorlds||[]),g.world].filter((x,i,a)=>x&&a.indexOf(x)===i);
  openModal(`<div class="row space"><div><h2 style="margin:0">旅途圖鑑</h2><div class="sub">走過的世界、收藏與事件會留在這裡。</div></div><button class="ghost" onclick="openGame()">回旅途</button></div>
    <div class="card flat"><h3>世界紀錄</h3>${worlds.length?worlds.map(w=>`<div class="codex-world"><b>${w}</b><div class="meta">${w===g.world?"目前旅行中":"已完成旅程"}</div></div>`).join(""):'<div class="empty">尚未留下世界紀錄</div>'}</div>
    <div class="card flat"><h3>收藏品 ${g.collections.length}</h3>${g.collections.slice().reverse().map(x=>`<div class="codex-world"><b>${x.name}</b><div class="meta">${x.desc||""}</div></div>`).join("")||'<div class="empty">還沒有收藏品</div>'}</div>

  setTimeout(()=>ev.currentTarget.classList.remove("dragging"),300);
}

  draggedScheduleItem={time,name};

}

function defaultTimeForPeriod(p){
  if(p==="morning") return "09:00";
  if(p==="afternoon") return "14:00";

}
function dropTaskToPeriod(ev,period){
  ev.preventDefault();
  if(draggedTaskId){
    const t=data.tasks.find(x=>x.id===draggedTaskId);
    if(!t)return;
    const time=prompt(`安排「${t.title}」到${periodLabel(period)}，請輸入時間：`,defaultTimeForPeriod(period));
    if(!time)return;
    data.schedule.push({time,name:t.title,category:t.type==="life"?"life":"study",taskId:t.id,date:dateKey(selectedTodayDate)});
    save();
    renderToday();
    toast("已加入今日安排");
    draggedTaskId=null;
    return;
  }
  if(draggedScheduleItem){
    const idx=data.schedule.findIndex(x=>x.time===draggedScheduleItem.time && x.name===draggedScheduleItem.name);
    if(idx<0)return;
    const newTime=prompt(`移動到${periodLabel(period)}，請輸入時間：`,defaultTimeForPeriod(period));
    if(!newTime)return;
    data.schedule[idx].time=newTime;
    save();
    renderToday();
    toast("今日安排已移動");
    draggedScheduleItem=null;
  }
}

function getAttentionItems(){
  ensureProductivity();
  const out=[];
  const courseNames=new Set((data.courses||[]).map(c=>c.name));

  // 只顯示仍存在科目的學習任務；沒有綁科目的學習任務仍可顯示。
  (data.tasks||[]).filter(t=>!t.done && t.type==="study" && (!t.course || courseNames.has(t.course))).forEach(t=>{
    if(!t.due)return;
    const left=daysLeft(t.due);
    let score=0,sub="";
    if(left<0){score=1000+Math.abs(left);sub=`已逾期 ${Math.abs(left)} 天`;}
    else if(left===0){score=900;sub="今天截止";}
    else if(left<=3){score=700-left;sub=`${left} 天後截止`;}
    else if(left<=7){score=500-left;sub=`${left} 天後截止`;}
    else return;
    out.push({kind:"task",id:t.id,course:t.course||"",title:t.title,sub,minutes:t.minutes||15,score});
  });

  // 作業：科目已刪除就完全不顯示。
  (data.assignments||[]).filter(a=>!a.course || courseNames.has(a.course)).forEach(a=>{
    const nodes=Array.isArray(a.nodes)?a.nodes:[];
    const unfinished=nodes.length?nodes.filter(n=>!n.done).length:1;
    if(!a.due || unfinished<=0)return;
    const left=daysLeft(a.due);
    if(left>7)return;
    const score=left<0?980+Math.abs(left):left===0?880:680-left;
    const sub=left<0?`已逾期 ${Math.abs(left)} 天・${unfinished} 項未完成`
      :left===0?`今天截止・${unfinished} 項未完成`
      :`${left} 天後截止・${unfinished} 項未完成`;
    out.push({kind:"assignment",course:a.course||"",title:`${a.course?`${a.course}｜`:""}${a.title}`,sub,minutes:25,score});
  });

  // 考試：科目已刪除就不顯示。
  (data.exams||[]).filter(e=>!e.course || courseNames.has(e.course)).forEach(e=>{
    if(!e.date)return;
    const left=daysLeft(e.date);
    if(left<0 || left>14)return;
    const score=left===0?850:left<=3?650-left:left<=7?430-left:250-left;
    out.push({kind:"exam",course:e.course||"",title:e.title||e.name||"考試",sub:left===0?"今天考試":`${left} 天後考試`,minutes:30,score});
  });

  // 科目落後提醒。
  (data.courses||[]).forEach(c=>{
    const gap=(c.teacherProgress||0)-(c.myProgress||0);
    if(gap>=15) out.push({
      kind:"course",course:c.name,title:`${c.name}｜進度落後`,
      sub:`老師比我快 ${gap}%`,minutes:25,score:180+gap
    });
  });

  const seen=new Set();
  return out.sort((a,b)=>b.score-a.score).filter(x=>{
    const k=`${x.kind}|${x.title}|${x.sub}`;
    if(seen.has(k))return false;
    seen.add(k);
    return true;
  }).slice(0,6);
}

  const c=(data.courses||[]).find(x=>x.name===course);

    else if(kind==="exam")openCourse(c.id,"exam");
    else openCourse(c.id,"overview");

function extractProgressNumber(s){
  const m=String(s||"").match(/(\d+)/);
  return m ? Math.max(0,parseInt(m[1],10)) : 0;
}
function ensureCourseChapters(c){
  if(Array.isArray(c.chapters) && c.chapters.length) return;
  const teacherN=extractProgressNumber(c.teacherAt);
  const meN=extractProgressNumber(c.meAt);
  const total=Math.max(teacherN,meN,6);
  c.chapters=[];
  for(let i=1;i<=total;i++){
    let prefix="Ch.";
    if(/^Unit/i.test(c.teacherAt||"")) prefix="Unit ";
    else if(/^L\./i.test(c.teacherAt||"")) prefix="L.";
    c.chapters.push({
      id:Date.now()+i,
      title:`${prefix}${i}`,
      note:"",
      myDone:i<=meN,
      teacherDone:i<=teacherN
    });
  }
  recalcCourseFromChapters(c,false);
}
function recalcCourseFromChapters(c,shouldSave=true){
  ensureCourseChaptersNoLoop(c);
  const total=c.chapters.length||1;
  const my=c.chapters.filter(x=>x.myDone).length;
  const teacher=c.chapters.filter(x=>x.teacherDone).length;
  c.myProgress=Math.round(my/total*100);
  c.teacherProgress=Math.round(teacher/total*100);
  c.meAt=my?c.chapters[Math.max(0,my-1)].title:"尚未開始";
  c.teacherAt=teacher?c.chapters[Math.max(0,teacher-1)].title:"尚未開始";
  if(shouldSave) save();
}
function ensureCourseChaptersNoLoop(c){
  if(!Array.isArray(c.chapters)) c.chapters=[];
}
function toggleChapterProgress(cid,chid,who){
  const c=data.courses.find(x=>x.id===cid); if(!c)return;
  ensureCourseChapters(c);
  const ch=c.chapters.find(x=>x.id===chid); if(!ch)return;
  if(who==="me") ch.myDone=!ch.myDone;
  else ch.teacherDone=!ch.teacherDone;
  recalcCourseFromChapters(c);
  openCourse(cid,"class");
}

function courseGrades(courseName){
  ensureProductivity();
  return (data.grades||[]).filter(g=>g.course===courseName).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function gradeStats(courseName){
  const arr=courseGrades(courseName);
  let contribution=0,weight=0,totalRaw=0,totalMax=0;
  arr.forEach(g=>{
    const score=Number(g.score)||0,max=Number(g.max)||100,w=Math.max(0,Number(g.weight)||0);
    totalRaw+=score;totalMax+=max;
    if(max>0 && w>0){contribution+=(score/max)*w;weight+=w;}
  });
  const current=weight>0?contribution/weight*100:(totalMax>0?totalRaw/totalMax*100:null);
  return {arr,contribution,weight,current};
}
function gradeClass(p){
  if(p==null)return "";
  return p>=80?"grade-good":p>=60?"grade-warn":"grade-bad";
}
function requiredRemainingScore(c){
  const s=gradeStats(c.name),target=Number(c.passScore??60);
  const remain=Math.max(0,100-s.weight);
  if(s.weight<=0||remain<=0)return null;
  return Math.max(0,(target-s.contribution)/remain*100);
}
function gradeSummaryHtml(c){
  const s=gradeStats(c.name),req=requiredRemainingScore(c);
  return `<div class="grade-summary">
    <div class="grade-kpi"><b class="${gradeClass(s.current)}">${s.current==null?"—":s.current.toFixed(1)}</b><small>目前平均</small></div>
    <div class="grade-kpi"><b>${s.weight.toFixed(0)}%</b><small>已記錄權重</small></div>
    <div class="grade-kpi"><b class="${req!=null&&req>100?"grade-bad":""}">${req==null?"—":req.toFixed(1)}</b><small>剩餘需平均</small></div>
  </div>`;
}

let pomoTimer=null,pomoSeconds=25*60,pomoRunning=false,pomoMode="focus",pomoTaskId=null;

function restorePomodoroState(){
  ensureProductivity();
  const s=data.appMeta.pomodoro;
  pomoMode=s.mode||"focus";pomoInitialSeconds=Number(s.initial)||1500;pomoTaskId=s.taskId??null;
  pomoStartedAt=s.startedAt||null;pomoEndAt=s.endAt||null;pomoRunning=!!s.running;
  pomoSeconds=pomoRunning&&pomoEndAt?Math.max(0,Math.ceil((Number(pomoEndAt)-Date.now())/1000)):Math.max(0,Number(s.seconds)||pomoInitialSeconds);
}
function persistPomodoroState(){
  data.appMeta.pomodoro={running:pomoRunning,mode:pomoMode,seconds:pomoSeconds,initial:pomoInitialSeconds,startedAt:pomoStartedAt,endAt:pomoEndAt,taskId:pomoTaskId};save();
}
async function requestWakeLock(){try{if("wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener?.("release",()=>wakeLock=null)}}catch(e){}}
function releaseWakeLock(){try{wakeLock?.release?.()}catch(e){}wakeLock=null}
function openPomodoro(taskId=null){
  restorePomodoroState();
  if(taskId!==null&&taskId!==undefined){pomoTaskId=taskId;data.appMeta.pomodoro.taskId=taskId;save()}
  renderPomodoroModal();if(pomoRunning)startPomodoroTicker();
}
function renderPomodoroModal(){

  <div style="height:12px"></div><div class="two"><button class="secondary" onclick="openFocusStats('month')">統計</button><button class="secondary" onclick="openMusicPanel()">♫ 音樂</button></div>

  <div style="height:10px"></div><div class="two"><button class="secondary" onclick="resetPomodoro()">重設</button><button class="primary" onclick="togglePomodoro()">${pomoRunning?"暫停":(pomoStartedAt?"繼續":"開始")}</button></div></div>`);
}
function syncPomodoroFromClock(){if(pomoRunning&&pomoEndAt)pomoSeconds=Math.max(0,Math.ceil((Number(pomoEndAt)-Date.now())/1000))}
function updatePomoDisplay(){syncPomodoroFromClock();const el=document.querySelector("#pomoDisplay");if(!el)return;const mm=String(Math.floor(pomoSeconds/60)).padStart(2,"0"),ss=String(pomoSeconds%60).padStart(2,"0");el.textContent=`${mm}:${ss}`}
function elapsedPomoSeconds(){if(pomoRunning)syncPomodoroFromClock();return Math.max(0,pomoInitialSeconds-pomoSeconds)}
function recordFocusSession(completed){
  ensureProductivity();if(pomoMode!=="focus")return;const elapsed=elapsedPomoSeconds();if(elapsed<3)return;
  const task=pomoTaskId?data.tasks.find(x=>x.id===pomoTaskId):null;
  data.focusSessions.push({id:Date.now(),startedAt:pomoStartedAt||new Date(Date.now()-elapsed*1000).toISOString(),endedAt:new Date().toISOString(),duration:elapsed,planned:pomoInitialSeconds,completed:!!completed,taskId:pomoTaskId||null,taskTitle:task?task.title:"",course:task?(task.course||""):"",hour:new Date(pomoStartedAt||Date.now()).getHours()});save();
}
function setPomodoro(min,mode){
  restorePomodoroState();if(pomoStartedAt&&pomoMode==="focus"&&elapsedPomoSeconds()>2)recordFocusSession(false);
  if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null}releaseWakeLock();
  pomoRunning=false;pomoMode=mode;pomoSeconds=min*60;pomoInitialSeconds=min*60;pomoStartedAt=null;pomoEndAt=null;pomoElapsedBeforePause=0;persistPomodoroState();renderPomodoroModal();
}
function startPomodoroTicker(){if(pomoTimer)clearInterval(pomoTimer);updatePomoDisplay();pomoTimer=setInterval(()=>{syncPomodoroFromClock();updatePomoDisplay();if(pomoSeconds<=0)finishPomodoro()},500)}
function togglePomodoro(){
  restorePomodoroState();
  if(pomoRunning){syncPomodoroFromClock();if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null}pomoRunning=false;pomoEndAt=null;persistPomodoroState();releaseWakeLock();renderPomodoroModal();return}
  if(!pomoStartedAt)pomoStartedAt=new Date().toISOString();pomoEndAt=Date.now()+Math.max(0,pomoSeconds)*1000;pomoRunning=true;persistPomodoroState();requestWakeLock();renderPomodoroModal();startPomodoroTicker();
}
function finishPomodoro(){
  if(!pomoRunning)return;if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null}
  pomoSeconds=0;pomoRunning=false;pomoEndAt=null;const wasFocus=pomoMode==="focus";
  if(wasFocus){recordFocusSession(true);const expedition=maybeExpeditionReward(pomoInitialSeconds);setTimeout(()=>expeditionReturn(expedition),120)}

function rangeStart(range){
  const now=new Date();
  if(range==="day") return new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(range==="week"){
    const d=(now.getDay()+6)%7;
    return new Date(now.getFullYear(),now.getMonth(),now.getDate()-d);
  }
  if(range==="month") return new Date(now.getFullYear(),now.getMonth(),1);
  if(range==="year") return new Date(now.getFullYear(),0,1);
  return new Date(0);
}
function sessionsForRange(range){
  ensureProductivity();
  const start=rangeStart(range);
  return data.focusSessions.filter(s=>new Date(s.startedAt)>=start);
}
function fmtDuration(sec){
  sec=Math.round(sec||0);
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h)return `${h}h${m}m`;
  if(m)return `${m}m${s?s+'s':''}`;
  return `${s}s`;
}
function openFocusStats(range="month"){
  focusStatsRange=range;

  const avg=done.length?total/done.length:0;
  const avgAb=abandon.length?abandon.reduce((a,s)=>a+(s.duration||0),0)/abandon.length:0;
  const hourTotals=Array(24).fill(0);
  ss.forEach(s=>hourTotals[s.hour ?? new Date(s.startedAt).getHours()]+=s.duration||0);
  const maxHour=Math.max(1,...hourTotals);
  const hours=hourTotals.map((v,h)=>v?`<div class="hour-row"><span>${String(h).padStart(2,"0")}:00</span><div class="hour-track"><div class="hour-fill" style="width:${Math.round(v/maxHour*100)}%"></div></div><b>${fmtDuration(v)}</b></div>`:"").join("")||'<div class="empty">這段期間還沒有專注紀錄。</div>';

  let calendar="";
  if(range==="month"){
    const now=new Date(),y=now.getFullYear(),m=now.getMonth(),last=new Date(y,m+1,0).getDate(),startDow=new Date(y,m,1).getDay();
    const byDay={};
    ss.forEach(s=>{const d=new Date(s.startedAt);if(d.getMonth()===m&&d.getFullYear()===y){const k=d.getDate();byDay[k]=(byDay[k]||0)+(s.completed?s.duration:0);}});
    let cells="";
    for(let i=0;i<startDow;i++)cells+='<div></div>';
    for(let d=1;d<=last;d++){
      const v=byDay[d]||0,level=v>=7200?4:v>=3600?3:v>=1200?2:v>0?1:0;
      cells+=`<div class="focus-cal-cell ${level?'l'+level:''}"><b>${d}</b>${v?`<small>${fmtDuration(v)}</small>`:""}</div>`;
    }
    calendar=`<div class="card flat"><h3>${y}.${String(m+1).padStart(2,"0")} 累計專注</h3><div class="focus-calendar">${["日","一","二","三","四","五","六"].map(x=>`<div class="meta" style="text-align:center">${x}</div>`).join("")}${cells}</div></div>`;
  }

  openModal(`<div class="row space"><div><h2 style="margin:0">專注統計</h2><div class="sub">番茄鐘自動記錄</div></div><button class="ghost" onclick="renderPomodoroModal()">回番茄鐘</button></div>

    </div>

      <div class="focus-stat"><b>${done.length}</b><small>專注次數</small></div>
      <div class="focus-stat"><b>${fmtDuration(avg)}</b><small>平均專注</small></div>
      <div class="focus-stat"><b>${fmtDuration(total)}</b><small>總時長</small></div>
      <div class="focus-stat"><b>${abandon.length}</b><small>放棄次數</small></div>
      <div class="focus-stat"><b>${fmtDuration(avgAb)}</b><small>平均放棄時長</small></div>
      <div class="focus-stat"><b>${new Set(done.map(s=>localDateKey(new Date(s.startedAt)))).size}</b><small>有專注天數</small></div>
    </div>

}

function stopAmbient(){
  ambientNodes.forEach(n=>{try{n.stop?.();n.disconnect?.();}catch(e){}});
  ambientNodes=[];
  if(ambientCtx){try{ambientCtx.close()}catch(e){} ambientCtx=null;}
}
function playAmbient(type){
  stopAmbient();
  ambientCtx=new (window.AudioContext||window.webkitAudioContext)();
  const sr=ambientCtx.sampleRate,buffer=ambientCtx.createBuffer(1,sr*2,sr),arr=buffer.getChannelData(0);
  let last=0;
  for(let i=0;i<arr.length;i++){
    const white=Math.random()*2-1;
    if(type==="rain"){last=(last+0.02*white)/1.02;arr[i]=last*3.2;}
    else arr[i]=white*0.35;
  }
  const src=ambientCtx.createBufferSource();src.buffer=buffer;src.loop=true;
  const gain=ambientCtx.createGain();gain.gain.value=.22;
  src.connect(gain).connect(ambientCtx.destination);src.start();
  ambientNodes=[src,gain];
  toast(type==="rain"?"雨聲播放中":"白噪音播放中");
  openMusicPanel(type==="rain"?"雨聲":"白噪音");
}

    if(i<start){day=prevLast-start+i+1;cm=m-1;other=true;if(cm<0){cm=11;cy=y-1}}
    else if(i>=start+last.getDate()){day=i-(start+last.getDate())+1;cm=m+1;other=true;if(cm>11){cm=0;cy=y+1}}
    else day=i-start+1;
    const key=lifeDateKey(cy,cm,day);
    cells+=`<button class="cal-day ${other?"other":""} ${selectedLifeDate===key?"selected":""} ${today===key?"today":""}" onclick="selectLifeDate('${key}')">
      ${day}${lifeDates.has(key)?'<span class="cal-dot"></span>':""}
    </button>`;
  }
  return `<div class="card flat life-calendar">
    <div class="cal-head">
      <button class="ghost" onclick="moveLifeMonth(-1)">‹</button>
      <div><b>${y}年 ${m+1}月</b><div class="sub">點日期即可加入生活事項</div></div>
      <button class="ghost" onclick="moveLifeMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${["日","一","二","三","四","五","六"].map(w=>`<div class="cal-week">${w}</div>`).join("")}
      ${cells}
    </div>
  </div>`;
}

function localDateKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function weekDatesFor(baseDate=new Date()){
  const d=new Date(baseDate);
  const dow=(d.getDay()+6)%7; // Monday = 0
  const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow);
  return Array.from({length:7},(_,i)=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i));
}
function ensureHabitData(){
  data.habits=data.habits||[];
  const thisWeek=weekDatesFor(new Date());
  data.habits=data.habits.map((h,idx)=>{
    if(!h.id) h.id=Date.now()+idx;
    if(!h.category) h.category=(/喝水|保養/.test(h.name)?"健康":/日文|英文|閱讀/.test(h.name)?"學習":"生活");
    if(!h.logs) h.logs={};
    // migrate old static week array into date-based logs
    if(Array.isArray(h.week)){
      h.week.forEach((v,i)=>{ if(v && thisWeek[i]) h.logs[localDateKey(thisWeek[i])]=true; });
      delete h.week;
    }
    return h;
  });
  save();
}
function habitCategories(){
  ensureHabitData();
  return [...new Set(data.habits.map(h=>h.category||"其他"))];
}
function toggleHabitDate(hid,dateKey){
  ensureHabitData();
  const h=data.habits.find(x=>x.id===hid); if(!h)return;
  h.logs=h.logs||{};
  h.logs[dateKey]=!h.logs[dateKey];
  if(!h.logs[dateKey]) delete h.logs[dateKey];
  save(); renderLife();
}

 const today=dateKey(new Date()), days=Math.max(1,daysLeft(t.due)+1), total=Math.max(5,t.minutes||15), each=Math.ceil(total/days/5)*5;
 data.tasks=data.tasks.filter(x=>x.autoParent!==id);

function taskScore(t){
  if(t.done)return -9999;
  const now=new Date(), due=t.due?new Date(t.due+"T23:59:59"):null;
  let s=(t.priority||0)*8;
  if(due){
    const days=(due-now)/86400000;
    if(days<0)s+=80; else if(days<=1)s+=60; else if(days<=3)s+=35; else if(days<=7)s+=15;
  }
  const mins=t.minutes||15;
  const cap=capacityFactor();
  if(cap<.5 && mins<=20)s+=25;
  if(cap>=.7 && mins>=25 && mins<=60)s+=8;
  return s;
}

   ${prog>=100?`<button class="primary" onclick="startNextJourney()">✦ 抽取下一個世界</button><div style="height:8px"></div>`:""}<button class="primary" onclick="dailySettlement()">🌙 今日結算</button>`);
}
function upgradeRoom(room){
 const g=gameData(),cost=(g.rooms[room]||1)*25;
 if(g.energy<cost)return toast(`需要 ${cost} 洋宅能量`);
 g.energy-=cost;g.rooms[room]=(g.rooms[room]||1)+1;save();openGame();toast(room+" 已擴建");
}
function buyReward(cost,name){
 const g=gameData();if(g.coins<cost)return toast("旅行貨幣不足");
 if(!confirm(`花 ${cost} 枚旅行貨幣兌換「${name}」？`))return;
 g.coins-=cost;save();openGame();toast("已兌換："+name);
}
function maybeExpeditionReward(duration){
 const g=gameData();
 const mins=Math.max(1,Math.round(duration/60));
 const coins=Math.max(2,Math.round(mins*.35)),energy=Math.max(1,Math.round(mins*.22)),travel=Math.max(1,Math.round(mins/18));
 g.coins+=coins;g.energy+=energy;g.travel=Math.min(100,(g.travel||0)+travel);
 let found=null;
 if(Math.random()<Math.min(.55,.15+mins/120)){
   const r=randomRewards[Math.floor(Math.random()*randomRewards.length)];
   found={name:r[0],desc:r[1],at:new Date().toISOString()};g.collections.push(found);
 }
 save();
 return {coins,energy,travel,found};
}
function expeditionReturn(result){
 openModal(`<h2>🐦 喜鵲回來了</h2><div class="settle-result">
   <div class="row space"><span>旅行貨幣</span><b>+${result.coins}</b></div>
   <div class="row space"><span>洋宅能量</span><b>+${result.energy}</b></div>
   <div class="row space"><span>旅程</span><b>+${result.travel}%</b></div>
 </div>${result.found?`<div class="event-card"><b>帶回物品｜${result.found.name}</b><div class="meta">${result.found.desc}</div></div>`:"<div class='meta'>這次沒有找到收藏品，但喜鵲平安回來了。</div>"}
 <div class="sheet-actions"><button class="primary" onclick="closeModal()">收下</button></div>`);
}
function settlementStats(){
 const k=localDateKey(new Date());
 const todays=data.tasks.filter(t=>t.due===k || (!t.due && sameDay(selectedTodayDate,new Date())));
 const done=todays.filter(t=>t.done).length,total=todays.length;
 ensureHabitData();
 const habitsDone=data.habits.filter(h=>h.logs&&h.logs[k]).length,habitsTotal=data.habits.length;
 const focus=data.focusSessions.filter(s=>localDateKey(new Date(s.startedAt))===k&&s.completed).reduce((a,s)=>a+(s.duration||0),0);
 return {done,total,habitsDone,habitsTotal,focus,ratio:total?done/total:1};
}
function dailySettlement(){
 const g=gameData(),k=localDateKey(new Date());
 if(g.lastSettlement===k && !confirm("今天已結算過。要重新查看結算嗎？"))return;
 const s=settlementStats();
 let state=s.ratio>=.85?"good":s.ratio>=.5?"normal":"low";
 let bonus=Math.round(s.done*3+s.focus/1200);
 if(g.lastSettlement!==k){
   g.coins+=bonus;g.energy+=Math.round(s.done*2+s.habitsDone);
   if(state==="good")g.travel=Math.min(100,g.travel+3);
 }
 let eventHtml="";
 if(g.lastSettlement!==k && state==="low" && Math.random()<.75){
   const pe=randomPenalties[Math.floor(Math.random()*randomPenalties.length)];
   g.penalties.push({...pe,date:k,active:true});
   eventHtml=`<div class="event-card"><b>⚠ 隨機事件｜${pe.name}</b><div class="meta">${pe.desc}</div></div>`;
 }else if(g.lastSettlement!==k && state==="good" && Math.random()<.55){
   const r=randomRewards[Math.floor(Math.random()*randomRewards.length)];
   g.collections.push({name:r[0],desc:r[1],at:new Date().toISOString()});
   eventHtml=`<div class="event-card"><b>🎁 意外的收穫｜${r[0]}</b><div class="meta">${r[1]}</div></div>`;
 }
 const qs=dailyQuotes[state],q=qs[Math.floor(Math.random()*qs.length)];
 if(g.lastSettlement!==k)g.lastSettlement=k;
 save();
 openModal(`<h2>🌙 今日旅途結算</h2>
   <div class="settle-result">
    <div class="row space"><span>任務</span><b>${s.done} / ${s.total}</b></div>
    <div class="row space"><span>習慣</span><b>${s.habitsDone} / ${s.habitsTotal}</b></div>
    <div class="row space"><span>專注</span><b>${fmtDuration(s.focus)}</b></div>
    <div class="row space"><span>結算獎勵</span><b>+${bonus} 🪙</b></div>
   </div>${eventHtml}
   <div class="card flat quote-card">「${q[1]}」<div class="meta">—— ${q[0]}</div><div style="height:8px"></div><button class="ghost" onclick="saveQuote('${q[0]}','${q[1].replace(/'/g,"")}')">♡ 收藏這句</button></div>
   <div class="sheet-actions"><button class="primary" onclick="closeModal()">結束今天的旅程</button></div>`);
}
function saveQuote(author,text){
 const g=gameData();
 if(!g.quotes.some(q=>q.text===text))g.quotes.push({author,text,date:localDateKey(new Date())});
 save();toast("已收藏語錄");
}


function goalPct(g){const a=g.steps||[];return a.length?Math.round(a.filter(x=>x.done).length/a.length*100):0}
function openGoals(){
  if(!Array.isArray(data.goals)) data.goals=[];
  const list=data.goals.length?data.goals.map(g=>`<div class="goal-card"><div class="goal-head"><div><div class="goal-title">${esc(g.title)}</div><div class="goal-meta">${g.deadline?`截止 ${g.deadline} · ${Math.max(0,daysLeft(g.deadline))} 天`:'未設定截止日'} · ${goalPct(g)}%</div></div><div class="goal-actions"><button class="ghost" onclick="editGoal(${g.id})">編輯</button><button class="ghost" onclick="deleteGoal(${g.id})">刪除</button></div></div><div class="progress" style="margin:10px 0"><i style="width:${goalPct(g)}%"></i></div>${(g.steps||[]).map((x,i)=>`<label class="goal-sub"><input type="checkbox" ${x.done?'checked':''} onchange="toggleGoalStep(${g.id},${i})"><span>${esc(x.title)}</span></label>`).join('')||'<div class="meta">還沒有子任務</div>'}</div>`).join(''):'<div class="card flat"><div class="meta">還沒有目標。可以從期末成績、讀完一本書、存款、旅行或生活習慣開始。</div></div>';
  openModal(`<div class="row space"><div><div class="letter-kicker">With Love and a Cherry on Top</div><h2 style="margin:4px 0">🍒 我的目標</h2></div><button class="ghost" onclick="closeModal()">關閉</button></div><button class="primary" onclick="editGoal()">＋ 建立目標</button>${list}`)
}
function editGoal(id){const g=id?data.goals.find(x=>x.id===id):null;openModal(`<div class="row space"><h2>${g?'編輯':'建立'}目標</h2><button class="ghost" onclick="openGoals()">返回</button></div><div class="field"><label>目標</label><input id="goalTitle" value="${g?esc(g.title):''}" placeholder="例如：期末 GPA ≥ 3.5"></div><div class="field"><label>截止日</label><input id="goalDeadline" type="date" value="${g?.deadline||''}"></div><div class="field"><label>目標備註／完成後感想</label><textarea id="goalNote" rows="3" placeholder="想記下的原因、獎勵或完成後感想">${g?esc(g.note||""):""}</textarea></div><div class="field"><label>子任務（一行一個）</label><textarea id="goalSteps" rows="7" placeholder="整理考試範圍\n完成第一輪複習\n完成第二輪複習">${g?(g.steps||[]).map(x=>x.title).join('\n'):''}</textarea></div><button class="primary" onclick="saveGoal(${id||0})">保存目標</button>`)}
function saveGoal(id){const title=document.querySelector('#goalTitle').value.trim(),deadline=document.querySelector('#goalDeadline').value,lines=document.querySelector('#goalSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!title){toast('請輸入目標');return}const old=id?data.goals.find(x=>x.id===id):null;const prev=new Map((old?.steps||[]).map(x=>[x.title,x.done]));const obj={id:id||Date.now(),title,deadline,note:document.querySelector("#goalNote")?.value.trim()||"",steps:lines.map(title=>({title,done:prev.get(title)||false}))};if(old)Object.assign(old,obj);else data.goals.push(obj);save();openGoals();toast('目標已保存')}
function toggleGoalStep(id,i){const g=data.goals.find(x=>x.id===id);if(!g||!g.steps[i])return;g.steps[i].done=!g.steps[i].done;save();if(goalPct(g)===100)toast('目標完成了 🍒');openGoals()}
function deleteGoal(id){if(!confirm('刪除這個目標？'))return;data.goals=data.goals.filter(x=>x.id!==id);save();openGoals();toast('已刪除目標')}

function renderMe(){
  ensureProductivity();
  const cap=data.dailyCapacity[localDateKey(new Date())]||"normal";
  document.querySelector('#header').innerHTML='<div><h1>我的</h1><div class="sub">自動化與每週回顧</div></div>';
  document.querySelector('#view').innerHTML=`
    <div class="section-title">目前旅程</div>${gameSummaryHtml()}
    <div class="section-title">今天怎麼安排</div>
    <div class="card flat">
      <div class="row space"><div><div class="task-title">${capacityLabel(cap)}</div><div class="meta">會影響「不知道做什麼」的推薦份量</div></div><button class="secondary" onclick="openCapacity()">調整</button></div>
      <div style="height:10px"></div><button class="primary" onclick="pickNextTask()">✦ 不知道做什麼</button>
    </div>
    <div class="section-title">快速工具</div>
    <div class="card flat"><div class="quick-grid">
      <button onclick="openInbox()">收件匣<br><small>${data.inbox.length} 項</small></button>
      <button onclick="openTimetable()">固定課表</button>
      <button onclick="openWeekPlanner()">週計畫</button>
      <button onclick="openGoals()">目標計畫</button>
      <button onclick="openExams()">考試倒數</button>
      <button onclick="openPomodoro()">番茄鐘</button>
      <button onclick="openTimerTool()">計時器</button>
      <button onclick="openFocusStats('month')">專注統計</button>
      <button onclick="rolloverOverdue()">整理逾期</button>
    </div><div style="height:8px"></div><button class="primary" onclick="syncTimetable(14)">同步未來 2 週固定課表</button></div>
    <div class="section-title">各科專注時間</div><div class="card flat">${courseFocusSummary()}</div>
    <div class="section-title">未來負荷</div>${loadHeatmapHtml()}
    <div class="section-title">本週報告</div>${weeklyReportHtml()}
    <div class="section-title">資料備份</div>
    <div class="two"><button class="secondary" onclick="exportData()">匯出備份</button><button class="secondary" onclick="importBackup()">匯入備份</button></div>
    <div style="height:8px"></div><button class="ghost" onclick="resetData()">重設資料</button>`;
}
function openEnergy(){
 openModal(`<h2>今天的狀態</h2><div class="energy">
 <button class="${data.energy==='normal'?'active':''}" onclick="setEnergy('normal')">🌤<br>正常</button>
 <button class="${data.energy==='low'?'active':''}" onclick="setEnergy('low')">☁️<br>低能量</button>
 <button class="${data.energy==='survival'?'active':''}" onclick="setEnergy('survival')">🌧<br>生存模式</button></div>
 <div class="card flat"><div class="meta">低能量會優先短任務；生存模式只保留近期與高優先事項。</div></div>`);
}
function setEnergy(v){data.energy=v;save();closeModal();if(v==="survival"){data.tasks.forEach(t=>{if(!t.done&&t.priority<2)t._hiddenToday=true})}else data.tasks.forEach(t=>delete t._hiddenToday);save();render();toast("今日模式已更新")}
function openAddCourse(){
 openModal(`<h2>新增科目</h2>
   <div class="field"><label>科目名稱</label><input id="courseName" placeholder="例如：成本會計" autocomplete="off"></div>
   <div class="sheet-actions"><button class="primary" onclick="addCourse()">保存並新增</button></div>`);
 setTimeout(()=>document.querySelector("#courseName")?.focus(),50);
}
function addCourse(){
  const input=document.querySelector("#courseName");
  if(!input){toast("新增視窗發生錯誤");return;}
  const n=input.value.trim();
  if(!n){toast("請輸入科目名稱");return;}
  if(data.courses.some(c=>c.name===n)){toast("這個科目已經存在");return;}
  data.courses.push({
    id:Date.now(),name:n,teacherProgress:0,myProgress:0,
    teacherAt:"尚未設定",meAt:"尚未設定",color:"#7b73d1",chapters:[]
  });
  save();
  closeModal();
  page="study";
  renderStudy();
  document.querySelectorAll(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page==="study"));
  toast("科目已新增");
}
function openAdd(){
 openModal(`<div class="row space"><h2>快速新增</h2><button class="ghost" onclick="openInbox()">收件匣</button></div>
 <div class="field"><label>類型</label><select id="newType"><option value="study">學習</option><option value="life">生活</option></select></div>
 <div class="field"><label>名稱</label><input id="newTitle" placeholder="例如：中會作業 8/25 30題"></div>
 <div class="two"><div class="field"><label>日期</label><input id="newDue" type="date" value="${page==="today"?dateKey(selectedTodayDate):""}"></div><div class="field"><label>分鐘</label><input id="newMinutes" type="number" value="15"></div></div>
 <div class="field"><label>科目（可留白）</label><select id="newCourse"><option value="">不指定</option>${data.courses.map(c=>`<option>${c.name}</option>`).join("")}</select></div>
 <div class="sheet-actions"><button class="primary" onclick="addTask()">加入</button></div>`);
}
function addTask(){
 let title=document.querySelector("#newTitle").value.trim(); if(!title)return;
 data.tasks.push({id:Date.now(),title,type:document.querySelector("#newType").value,course:document.querySelector("#newCourse").value,minutes:+document.querySelector("#newMinutes").value||15,due:document.querySelector("#newDue").value,done:false,priority:2,minMinutes:Math.min(10,+document.querySelector('#newMinutes').value||15),subtasks:[]});
 save();closeModal();render();toast("已新增");
}
function openModal(html){document.querySelector("#sheet").innerHTML=html;document.querySelector("#modal").classList.add("show")}
function closeModal(){document.querySelector("#modal").classList.remove("show")}
document.querySelector("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.querySelectorAll(".nav[data-page]").forEach(b=>b.addEventListener("click",()=>{
  page=b.dataset.page;
  try{render()}catch(err){
    console.error(err);
    toast("頁面載入失敗，已保留資料");
  }
}));
document.querySelector("#addBtn").addEventListener("click",e=>{e.preventDefault();openAdd()});
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="study-life-backup.json";a.click();URL.revokeObjectURL(a.href)
}
function resetData(){if(confirm("確定要重設為示範資料？")){data=structuredClone(defaultData);save();render();toast("已重設")}}
render();
</script>

<script>
(function(){
  const studyQuotes=[
    "游依，今天不用走很遠，先把眼前這一頁讀完。",
    "喜鵲已經飛出去找線索了，你也該開始今天的學習了。",
    "比老師慢一章沒關係，但今天至少往前追一小段。",
    "先做最短的那一項。開始之後，剩下的路通常沒有想像中長。",
    "洋宅的書房還亮著燈。今天留一點時間給自己讀書吧。",
    "不用一次完成全部，先專注二十五分鐘。",
    "今天讀過的每一頁，都會變成旅途中真正走過的路。",
    "游依，別只整理待辦。挑一件，現在開始。",
    "喜鵲不會替你把章節讀完——但牠可以等你一起出發。",
    "如果不想開始，就選五分鐘。五分鐘後再決定要不要繼續。"
  ];
  window.studyQuotes=studyQuotes;
  window.renderStudyNudge=function(){
    const q=studyQuotes[Math.floor(Math.random()*studyQuotes.length)];
    return `<div class="card flat" style="margin:0 0 16px;background:#fbfaff;border:1px solid #eeeafd">
      <div class="meta">今日督促</div>
      <div style="font-size:15px;line-height:1.65;margin-top:5px">「${q}」</div>
      <div class="row space" style="margin-top:8px"><span class="meta">— 旅途留言</span><button class="ghost" onclick="this.closest('.card').querySelector('div:nth-child(2)').textContent='「'+studyQuotes[Math.floor(Math.random()*studyQuotes.length)]+'」'">換一句</button></div>
    </div>`;
  };

  document.addEventListener("click",function(e){
    if(!document.body || !document.body.textContent.includes("我的科目")) return;
    const card=e.target.closest(".course,.subject-card,.course-card,[data-subject],[data-course]");
    if(!card || e.target.closest("button,a,input,select")) return;
    let id=card.dataset.subject||card.dataset.course||card.dataset.id;
    let title=(card.querySelector(".task-title,h3,h2,b")||{}).textContent;
    if(typeof window.openSubject==="function") { window.openSubject(id||title); return; }
    if(typeof window.openCourse==="function") { window.openCourse(id||title); return; }
    if(typeof window.subjectDetail==="function") { window.subjectDetail(id||title); return; }
  },true);

  // Inject the nudge into Study after every render without altering layout elsewhere.
  const obs=new MutationObserver(()=>{
    const v=document.querySelector("#view");
    if(!v || !v.textContent.includes("我的科目") || v.querySelector(".study-nudge-added")) return;
    const heading=[...v.querySelectorAll(".section-title")].find(x=>x.textContent.includes("我的科目"));
    if(heading){
      const wrap=document.createElement("div"); wrap.className="study-nudge-added";
      wrap.innerHTML=renderStudyNudge(); heading.parentNode.insertBefore(wrap,heading);
    }
  });
  document.addEventListener("DOMContentLoaded",()=>obs.observe(document.body,{childList:true,subtree:true}));
})();
</script>
